version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: freightconnect_db
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - freightconnect_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freightconnect_api
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/freightconnect
      JWT_SECRET: your_jwt_secret_key_min_32_chars
      PORT: 5000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - freightconnect_network

volumes:
  mongodb_data:

networks:
  freightconnect_network:
    driver: bridge
